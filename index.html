<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e14" />
  <title>Lumi Device Platform — API 测试台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e14;
      --bg-2: #0f141b;
      --bg-3: #161c25;
      --bg-4: #1d2530;
      --border: #2a3340;
      --border-2: #3a4452;
      --fg: #e6edf3;
      --fg-2: #9aa5b1;
      --fg-3: #6b7480;
      --accent: #7cf6a6;
      --accent-2: #4fd99a;
      --accent-glow: rgba(124, 246, 166, 0.15);
      --warn: #ffb454;
      --error: #ff6b6b;
      --info: #56b6e6;
      --purple: #c792ea;
      --app-side: #56b6e6;
      --device-side: #c792ea;
      --both-side: #7cf6a6;
      --shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
      background: var(--bg);
      color: var(--fg);
      font-size: 13px;
      line-height: 1.5;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background-image:
        radial-gradient(circle at 15% 0%, rgba(86, 182, 230, 0.06) 0%, transparent 50%),
        radial-gradient(circle at 85% 100%, rgba(199, 146, 234, 0.06) 0%, transparent 50%);
    }

    .display-font { font-family: 'Space Grotesk', sans-serif; }

    /* ===== 顶部 Header ===== */
    header {
      display: flex;
      align-items: center;
      padding: 14px 20px;
      background: linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 100%);
      border-bottom: 1px solid var(--border);
      gap: 16px;
      position: relative;
      z-index: 10;
      flex-shrink: 0;
    }
    header::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.4;
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.04em;
    }
    .logo-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.85); }
    }
    .header-meta {
      display: flex; gap: 20px; margin-left: auto;
      color: var(--fg-3); font-size: 11px;
    }
    .header-meta span strong { color: var(--fg-2); font-weight: 500; }

    /* ===== 配置面板 ===== */
    .config-panel {
      background: var(--bg-2);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px 16px;
      display: grid;
      grid-template-columns: 0.8fr 1.3fr 1.5fr auto;
      gap: 14px;
      align-items: stretch;
      flex-shrink: 0;
    }
    .config-panel.hidden { display: none; }

    /* 配置分组卡片 */
    .config-group {
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 14px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .config-group::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 2px;
    }
    .config-group.group-common::before { background: var(--fg-3); }
    .config-group.group-app::before { background: var(--app-side); }
    .config-group.group-device::before { background: var(--device-side); }

    .config-group-header {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      min-height: 24px;
    }
    .config-tag {
      font-size: 9px; font-weight: 700;
      padding: 2px 7px; border-radius: 3px;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }
    .config-tag.tag-common { background: rgba(154, 165, 177, 0.15); color: var(--fg-2); border: 1px solid rgba(154, 165, 177, 0.3); }
    .config-tag.tag-app { background: rgba(86, 182, 230, 0.15); color: var(--app-side); border: 1px solid rgba(86, 182, 230, 0.3); }
    .config-tag.tag-device { background: rgba(199, 146, 234, 0.15); color: var(--device-side); border: 1px solid rgba(199, 146, 234, 0.3); }
    .config-group-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px; font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--fg);
    }
    .config-group-header .btn-mini {
      margin-left: auto;
      padding: 3px 10px; font-size: 10px;
      border-radius: 10px;
      line-height: 1.4;
    }
    .config-group-fields {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      flex: 1;
    }
    .config-group.group-app .config-group-fields,
    .config-group.group-device .config-group-fields {
      grid-template-columns: 1fr 1fr;
    }
    /* hint 字段跨列 */
    .config-group.group-app .field:has(.hint),
    .config-group.group-device .field:has(.hint) {
      grid-column: 1 / -1;
    }

    .btn-mini {
      background: var(--bg-4);
      border: 1px solid var(--border-2);
      color: var(--fg-2);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .btn-mini:hover { background: var(--accent); color: #0a0e14; border-color: var(--accent); }

    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label {
      font-size: 10px; color: var(--fg-3);
      text-transform: uppercase; letter-spacing: 0.08em;
      font-weight: 500;
    }
    .field input, .field select {
      background: var(--bg-3);
      border: 1px solid var(--border);
      color: var(--fg);
      padding: 8px 10px;
      font-family: inherit;
      font-size: 12px;
      border-radius: 4px;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }
    .field input:focus, .field select:focus {
      border-color: var(--accent);
      background: var(--bg-4);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .field input[type="password"] { font-family: 'JetBrains Mono', monospace; }
    .field .hint { font-size: 10px; color: var(--fg-3); margin-top: 2px; }

    .btn {
      padding: 8px 14px;
      border: 1px solid var(--border-2);
      background: var(--bg-3);
      color: var(--fg);
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.15s;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .btn:hover { background: var(--bg-4); border-color: var(--fg-3); }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary {
      background: var(--accent); color: #0a0e14;
      border-color: var(--accent); font-weight: 700;
    }
    .btn-primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
    .btn-ghost { background: transparent; }
    .btn-toggle {
      padding: 4px 10px; font-size: 11px;
      border-radius: 12px;
    }
    .btn-toggle.active { background: var(--accent); color: #0a0e14; border-color: var(--accent); }

    .config-actions {
      display: flex; flex-direction: column; gap: 8px;
      justify-content: flex-end;
      align-self: stretch;
      padding-bottom: 2px;
    }
    .config-actions .btn { width: 100%; justify-content: center; }

    /* ===== 主体布局 ===== */
    main {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      background: var(--border);
    }

    /* Tab 切换栏 */
    .main-tabs {
      display: flex;
      gap: 0;
      background: var(--bg-2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .main-tab {
      padding: 10px 20px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--fg-3);
      cursor: pointer;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px; font-weight: 700;
      letter-spacing: 0.04em;
      transition: all 0.15s;
    }
    .main-tab:hover { color: var(--fg-2); background: rgba(255,255,255,0.02); }
    .main-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background: var(--bg);
    }

    /* Tab 内容区 */
    .tab-content {
      display: none;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    .tab-content.active {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border);
    }
    #tabScenario.active {
      grid-template-columns: 1fr;
    }

    .side {
      background: var(--bg);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .side-header {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px;
      background: var(--bg-2);
      border-bottom: 1px solid var(--border);
    }
    .side-tag {
      font-size: 10px; font-weight: 700;
      padding: 3px 8px; border-radius: 3px;
      letter-spacing: 0.08em;
    }
    .side-tag.app { background: rgba(86, 182, 230, 0.15); color: var(--app-side); border: 1px solid rgba(86, 182, 230, 0.3); }
    .side-tag.device { background: rgba(199, 146, 234, 0.15); color: var(--device-side); border: 1px solid rgba(199, 146, 234, 0.3); }
    .side-tag.scenario { background: rgba(255, 180, 84, 0.15); color: var(--warn); border: 1px solid rgba(255, 180, 84, 0.3); }
    .side-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px; font-weight: 700; letter-spacing: 0.04em;
    }
    .side-actions { margin-left: auto; display: flex; gap: 6px; }

    /* ===== 用例列表 ===== */
    .cases {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .cases::-webkit-scrollbar { width: 6px; }
    .cases::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 3px; }
    .cases::-webkit-scrollbar-track { background: transparent; }

    .case-row {
      display: grid;
      grid-template-columns: 56px 1fr auto;
      gap: 10px;
      padding: 10px 12px;
      margin-bottom: 4px;
      background: var(--bg-2);
      border: 1px solid transparent;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.12s;
      align-items: center;
    }
    .case-row:hover {
      background: var(--bg-3);
      border-color: var(--border-2);
    }
    .case-row.selected {
      border-color: var(--accent);
      background: var(--bg-3);
      box-shadow: inset 3px 0 0 var(--accent);
    }
    .case-row.running {
      border-color: var(--warn);
      background: rgba(255, 180, 84, 0.05);
    }
    .case-id {
      font-weight: 700;
      font-size: 11px;
      color: var(--fg-3);
    }
    .case-row.passed .case-id { color: var(--accent); }
    .case-row.failed .case-id { color: var(--error); }
    .case-name {
      font-size: 12px;
      color: var(--fg);
    }
    .case-name .case-desc {
      display: block;
      font-size: 10px;
      color: var(--fg-3);
      margin-top: 2px;
    }
    .case-status {
      width: 18px; height: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px;
      border-radius: 50%;
    }
    .case-status.pending { color: var(--fg-3); }
    .case-status.passed { color: var(--accent); }
    .case-status.failed { color: var(--error); }
    .case-status.running { color: var(--warn); animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .group-divider {
      margin: 12px 4px 6px;
      padding: 6px 8px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--fg-3);
      text-transform: uppercase;
      display: flex; align-items: center; gap: 10px;
    }
    .group-divider::after {
      content: '';
      flex: 1; height: 1px;
      background: var(--border);
    }

    /* ===== 详情面板 ===== */
    .detail {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
    }
    .detail::-webkit-scrollbar { width: 6px; }
    .detail::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 3px; }

    .detail-empty {
      display: flex; align-items: center; justify-content: center;
      height: 100%;
      color: var(--fg-3);
      font-size: 12px;
      text-align: center;
      flex-direction: column;
      gap: 8px;
    }
    .detail-empty .icon {
      font-size: 36px;
      opacity: 0.3;
    }

    .detail-header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .detail-id {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px;
      font-weight: 700;
    }
    .detail-id.passed { color: var(--accent); }
    .detail-id.failed { color: var(--error); }
    .detail-title { flex: 1; }
    .detail-title h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: var(--fg);
    }
    .detail-title .desc { font-size: 11px; color: var(--fg-3); margin-top: 2px; }

    .status-badge {
      padding: 4px 10px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .status-badge.pass { background: rgba(124, 246, 166, 0.15); color: var(--accent); border: 1px solid rgba(124, 246, 166, 0.3); }
    .status-badge.fail { background: rgba(255, 107, 107, 0.15); color: var(--error); border: 1px solid rgba(255, 107, 107, 0.3); }
    .status-badge.pending { background: var(--bg-3); color: var(--fg-3); border: 1px solid var(--border); }

    .section {
      margin-bottom: 18px;
    }
    .section-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--fg-3);
      text-transform: uppercase;
      margin-bottom: 8px;
      display: flex; align-items: center; gap: 8px;
    }
    .section-title::before {
      content: '';
      width: 3px; height: 12px;
      background: var(--accent);
      border-radius: 2px;
    }

    .step {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .step-header {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px;
      background: var(--bg-3);
      border-bottom: 1px solid var(--border);
      font-size: 11px;
    }
    .step-method {
      padding: 2px 8px;
      border-radius: 3px;
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 0.05em;
    }
    .step-method.GET { background: rgba(86, 182, 230, 0.2); color: var(--info); }
    .step-method.POST { background: rgba(124, 246, 166, 0.15); color: var(--accent); }
    .step-method.DELETE { background: rgba(255, 107, 107, 0.15); color: var(--error); }
    .step-method.LOCAL { background: rgba(199, 146, 234, 0.15); color: var(--purple); }
    .step-method.B { background: rgba(255, 180, 84, 0.15); color: var(--warn); }
    .step-path { color: var(--fg-2); flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .step-url {
      flex: 1; font-size: 10px; color: var(--fg-3);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      padding: 0 6px; border-left: 1px solid var(--border);
    }
    .step-copy-btn {
      flex-shrink: 0; margin-left: auto;
      padding: 2px 8px; font-size: 10px;
      border-radius: 10px;
    }
    .step-error .step-header { background: rgba(255, 107, 107, 0.06); }
    .step-sub { margin-top: -6px; opacity: 0.8; font-size: 11px; }

    /* ===== 场景序列图 ===== */
    .scenario-sequence {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-2);
    }
    .seq-card {
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .seq-card-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--warn);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .seq-card-title .tag {
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 2px;
      background: rgba(255, 180, 84, 0.15);
      border: 1px solid rgba(255, 180, 84, 0.3);
    }
    .seq-flow {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
      font-size: 10px;
    }
    .seq-step {
      padding: 3px 8px;
      background: var(--bg-4);
      border: 1px solid var(--border-2);
      border-radius: 3px;
      color: var(--fg-2);
      white-space: nowrap;
    }
    .seq-step .num {
      color: var(--accent);
      font-weight: 700;
      margin-right: 3px;
    }
    .seq-arrow {
      color: var(--fg-3);
      font-size: 11px;
    }
    .seq-bridge {
      color: var(--warn);
      font-size: 10px;
      padding: 2px 6px;
      border: 1px dashed var(--warn);
      border-radius: 3px;
      margin: 0 4px;
    }
    .seq-bridge-card .seq-bridge-flow {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: center;
    }
    .seq-bridge-side .seq-card {
      box-shadow: none;
      padding: 0;
      margin: 0;
      background: transparent;
      border: none;
    }
    .seq-bridge-side .seq-card-title {
      font-size: 10px;
      padding: 4px 8px;
      background: var(--bg-4);
      border-radius: 3px;
      margin-bottom: 4px;
    }
    .seq-bridge-mid {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .seq-bridge-arrow {
      font-size: 10px;
      color: var(--warn);
      padding: 3px 8px;
      background: rgba(255, 180, 84, 0.1);
      border: 1px dashed var(--warn);
      border-radius: 3px;
      white-space: nowrap;
    }
    .uml-seq-container {
      overflow-x: auto;
      padding: 4px 0;
    }
    .uml-seq-container svg {
      display: block;
      margin: 0 auto;
    }

    /* ===== 批量结果浮层 ===== */
    .batch-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 50;
      display: none;
      align-items: center; justify-content: center;
      backdrop-filter: blur(4px);
    }
    .batch-overlay.show { display: flex; }
    .batch-content {
      background: var(--bg);
      border: 1px solid var(--border-2);
      border-radius: 8px;
      width: 90vw; max-width: 1100px;
      height: 85vh;
      display: flex; flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .batch-header {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 20px;
      background: var(--bg-2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .batch-title { display: flex; align-items: center; gap: 10px; flex: 1; }
    .batch-tag {
      font-size: 10px; font-weight: 700;
      padding: 3px 8px; border-radius: 3px;
      letter-spacing: 0.08em;
      background: rgba(255, 180, 84, 0.15); color: var(--warn);
      border: 1px solid rgba(255, 180, 84, 0.3);
    }
    #batchSummary { font-size: 13px; color: var(--fg-2); }
    .batch-actions { display: flex; gap: 8px; }
    .batch-filter {
      display: flex; gap: 6px;
      padding: 8px 20px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .batch-filter-btn {
      background: var(--bg-3);
      border: 1px solid var(--border);
      color: var(--fg-3);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .batch-filter-btn:hover { color: var(--fg-2); }
    .batch-filter-btn.active {
      background: var(--accent); color: #0a0e14;
      border-color: var(--accent);
    }
    .batch-list {
      flex: 1; overflow-y: auto;
      padding: 12px 20px;
    }
    .batch-item {
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 8px;
      background: var(--bg-2);
      overflow: hidden;
    }
    .batch-item.passed { border-left: 3px solid var(--accent); }
    .batch-item.failed { border-left: 3px solid var(--error); }
    .batch-item-header {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px;
      cursor: pointer;
      user-select: none;
    }
    .batch-item-header:hover { background: var(--bg-3); }
    .batch-item-id {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px; font-weight: 700;
      padding: 2px 6px; border-radius: 3px;
      background: var(--bg-4); color: var(--fg-2);
    }
    .batch-item-name { flex: 1; font-size: 12px; color: var(--fg); }
    .batch-item-status {
      font-size: 10px; font-weight: 700;
      padding: 2px 8px; border-radius: 3px;
    }
    .batch-item-status.pass { background: rgba(124, 246, 166, 0.15); color: var(--accent); }
    .batch-item-status.fail { background: rgba(255, 107, 107, 0.15); color: var(--error); }
    .batch-item-detail {
      display: none;
      padding: 0 12px 12px;
      border-top: 1px solid var(--border);
    }
    .batch-item.expanded .batch-item-detail { display: block; }
    .batch-item-detail pre {
      font-size: 11px; white-space: pre-wrap; word-break: break-all;
      margin: 8px 0 0;
      color: var(--fg-2);
    }
    .batch-item-detail .err-msg { color: var(--error); }
    .batch-item-detail .step-list { margin-top: 6px; }
    .batch-item-detail .step-mini {
      font-size: 11px; padding: 4px 8px; margin: 2px 0;
      background: var(--bg-3); border-radius: 3px;
      display: flex; gap: 8px; align-items: center;
    }
    .batch-item-detail .step-mini .m { font-size: 9px; font-weight: 700; padding: 1px 4px; border-radius: 2px; }
    .batch-item-detail .step-mini .m.GET { background: rgba(86, 182, 230, 0.15); color: var(--app-side); }
    .batch-item-detail .step-mini .m.POST { background: rgba(124, 246, 166, 0.15); color: var(--accent); }
    .batch-item-detail .step-mini .m.DELETE { background: rgba(255, 107, 107, 0.15); color: var(--error); }
    .batch-item-detail .step-mini .m.LOCAL { background: rgba(199, 146, 234, 0.15); color: var(--purple); }
    .batch-item-detail .step-mini .s { font-weight: 700; margin-left: auto; }
    .step-status {
      padding: 2px 8px; border-radius: 3px;
      font-weight: 700; font-size: 10px;
    }
    .step-status.s2xx { background: rgba(124, 246, 166, 0.15); color: var(--accent); }
    .step-status.s4xx { background: rgba(255, 180, 84, 0.15); color: var(--warn); }
    .step-status.s5xx { background: rgba(255, 107, 107, 0.15); color: var(--error); }
    .step-status.sok { background: rgba(124, 246, 166, 0.15); color: var(--accent); }
    .step-body {
      padding: 10px 12px;
      font-size: 11px;
    }
    .step-body-label {
      font-size: 9px;
      color: var(--fg-3);
      letter-spacing: 0.08em;
      margin-bottom: 4px;
      text-transform: uppercase;
    }
    pre {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--fg);
      background: var(--bg);
      padding: 8px 10px;
      border-radius: 3px;
      overflow-x: auto;
      border: 1px solid var(--border);
      white-space: pre-wrap;
      word-break: break-all;
    }
    pre::-webkit-scrollbar { height: 6px; }
    pre::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 3px; }

    .assertions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 4px;
    }
    .assertion {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 10px;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 3px;
      font-size: 11px;
    }
    .assertion .icon {
      width: 14px; height: 14px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700;
    }
    .assertion.pass .icon { background: var(--accent); color: #0a0e14; }
    .assertion.fail .icon { background: var(--error); color: #fff; }
    .assertion .name { flex: 1; color: var(--fg-2); }

    /* ===== 底部汇总 ===== */
    .summary {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--bg-2);
      border-top: 1px solid var(--border);
      padding: 8px 20px;
      display: flex; gap: 20px;
      align-items: center;
      font-size: 11px;
      z-index: 20;
      transform: translateY(100%);
      transition: transform 0.3s ease;
    }
    .summary.visible { transform: translateY(0); }
    .summary-stat {
      display: flex; align-items: center; gap: 6px;
    }
    .summary-stat .num {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 14px;
    }
    .summary-stat.pass .num { color: var(--accent); }
    .summary-stat.fail .num { color: var(--error); }
    .summary-stat .label { color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.06em; font-size: 10px; }
    .summary-bar {
      flex: 1;
      height: 6px;
      background: var(--bg-3);
      border-radius: 3px;
      overflow: hidden;
      display: flex;
    }
    .summary-bar .pass-seg { background: var(--accent); transition: width 0.4s; }
    .summary-bar .fail-seg { background: var(--error); transition: width 0.4s; }

    .toast {
      position: fixed;
      top: 70px; right: 20px;
      padding: 10px 16px;
      background: var(--bg-3);
      border: 1px solid var(--border-2);
      border-left: 3px solid var(--accent);
      border-radius: 4px;
      font-size: 12px;
      box-shadow: var(--shadow);
      z-index: 100;
      animation: slideIn 0.25s ease;
    }
    .toast.error { border-left-color: var(--error); }
    .toast.warn { border-left-color: var(--warn); }
    @keyframes slideIn {
      from { transform: translateX(120%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    /* 移动端折叠 */
    @media (max-width: 768px) {
      .config-panel { grid-template-columns: 1fr 1fr; }
      main { grid-template-columns: 1fr; }
      .side { display: none; }
      .side.active { display: flex; }
      .mobile-tabs { display: flex !important; }
    }
    .mobile-tabs { display: none; }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-dot"></span>
    <span>LUMI · API TEST CONSOLE</span>
  </div>
  <div class="header-meta">
    <span><strong>端点</strong> 11</span>
    <span><strong>用例</strong> A(12) + B(24)</span>
    <span id="connStatus"><strong>状态</strong> <span style="color: var(--fg-3)">未连接</span></span>
  </div>
</header>

<!-- 配置面板 -->
<section class="config-panel" id="configPanel">
  <!-- 通用 -->
  <div class="config-group group-common">
    <div class="config-group-header">
      <span class="config-tag tag-common">通用</span>
      <span class="config-group-title">API 连接</span>
      <button class="btn btn-mini" data-action="save-group" data-group="common">保存</button>
    </div>
    <div class="config-group-fields">
      <div class="field">
        <label>API Base URL</label>
        <input id="cfg-baseUrl" type="text" placeholder="https://api.lumi.example.com" />
      </div>
    </div>
  </div>

  <!-- 用户信息 -->
  <div class="config-group group-app">
    <div class="config-group-header">
      <span class="config-tag tag-app">APP · USER</span>
      <span class="config-group-title">用户信息</span>
      <button class="btn btn-toggle btn-mini" data-action="save-group" data-group="user">保存</button>
    </div>
    <div class="config-group-fields">
      <div class="field">
        <label>用户账号</label>
        <input id="cfg-account" type="text" placeholder="tester" />
      </div>
      <div class="field">
        <label>用户密码</label>
        <input id="cfg-password" type="password" placeholder="至少10位" />
      </div>
      <div class="field">
        <label>child_profile_id</label>
        <input id="cfg-childProfileId" type="text" placeholder="child-1" />
        <span class="hint">绑定设备时使用的儿童档案 ID</span>
      </div>
    </div>
  </div>

  <!-- 设备信息 -->
  <div class="config-group group-device">
    <div class="config-group-header">
      <span class="config-tag tag-device">DEVICE</span>
      <span class="config-group-title">设备信息</span>
      <button class="btn btn-toggle btn-mini" data-action="save-group" data-group="device">保存</button>
    </div>
    <div class="config-group-fields">
      <div class="field">
        <label>设备 SN</label>
        <input id="cfg-deviceSn" type="text" placeholder="K1-2026-000001" />
      </div>
      <div class="field">
        <label>device_secret (base64url, 43字符)</label>
        <input id="cfg-deviceSecret" type="password" placeholder="AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8" />
        <span class="hint">32字节密钥的 base64url 编码</span>
      </div>
      <div class="field">
        <label>product_id</label>
        <input id="cfg-productId" type="text" value="k1" />
      </div>
      <div class="field">
        <label>credential_version</label>
        <input id="cfg-credentialVersion" type="number" value="1" />
      </div>
      <div class="field">
        <label>capability_digest</label>
        <input id="cfg-capabilityDigest" type="text" placeholder="sha256:..." />
        <span class="hint">设备能力声明 SHA-256；留空使用全 0 占位（仅本地测试）</span>
      </div>
    </div>
  </div>

  <div class="config-actions">
    <button class="btn btn-primary" id="btnConnect">连接</button>
    <button class="btn" id="btnSave">保存全部</button>
    <button class="btn btn-ghost" id="btnToggleConfig">收起</button>
  </div>
</section>

<!-- 主体 -->
<main id="main">
  <!-- Tab 切换栏 -->
  <div class="main-tabs">
    <button class="main-tab active" data-tab="unit">单元测试</button>
    <button class="main-tab" data-tab="scenario">场景测试</button>
  </div>

  <!-- Tab 内容：单元测试（APP/DEVICE 双栏） -->
  <div class="tab-content active" id="tabUnit">
    <!-- 左侧 APP -->
    <section class="side app-side" id="sideApp">
      <div class="side-header">
        <span class="side-tag app">APP · USER</span>
        <span class="side-title">用户端 API</span>
        <div class="side-actions">
          <button class="btn btn-toggle" data-action="run-group" data-group="A-app">运行 A 组</button>
          <button class="btn btn-toggle" data-action="run-group" data-group="B-app">运行 B 组</button>
        </div>
      </div>
      <div class="cases" id="casesApp"></div>
    </section>

    <!-- 右侧 设备 -->
    <section class="side device-side" id="sideDevice">
      <div class="side-header">
        <span class="side-tag device">DEVICE</span>
        <span class="side-title">设备端 API</span>
        <div class="side-actions">
          <button class="btn btn-toggle" data-action="run-group" data-group="A-device">运行 A 组</button>
          <button class="btn btn-toggle" data-action="run-group" data-group="B-device">运行 B 组</button>
        </div>
      </div>
      <div class="cases" id="casesDevice"></div>
    </section>
  </div>

  <!-- Tab 内容：场景测试（单栏） -->
  <div class="tab-content" id="tabScenario">
    <section class="side scenario-side" id="sideScenario">
      <div class="side-header">
        <span class="side-tag scenario">SCENARIO</span>
        <span class="side-title">端到端业务场景</span>
        <div class="side-actions">
          <button class="btn btn-toggle" data-action="run-group" data-group="S-all">运行全部场景</button>
        </div>
      </div>
      <div class="cases" id="casesScenario"></div>
    </section>
  </div>
</main>

<!-- 详情浮层（点击用例后展开） -->
<div id="detailOverlay" style="position: fixed; top: 60px; right: 0; bottom: 0; width: 50%; background: var(--bg); border-left: 1px solid var(--border); transform: translateX(100%); transition: transform 0.3s; z-index: 30; overflow-y: auto; display: none;"></div>

<!-- 批量结果浮层 -->
<div id="batchOverlay" class="batch-overlay">
  <div class="batch-content">
    <div class="batch-header">
      <div class="batch-title">
        <span class="batch-tag">批量结果</span>
        <span id="batchSummary"></span>
      </div>
      <div class="batch-actions">
        <button class="btn btn-primary" id="btnBatchCopy">复制全部失败</button>
        <button class="btn btn-ghost" id="btnBatchClose">关闭</button>
      </div>
    </div>
    <div class="batch-filter">
      <button class="btn btn-mini batch-filter-btn active" data-filter="failed">仅失败</button>
      <button class="btn btn-mini batch-filter-btn" data-filter="all">全部</button>
      <button class="btn btn-mini batch-filter-btn" data-filter="passed">仅通过</button>
    </div>
    <div class="batch-list" id="batchList"></div>
  </div>
</div>

<!-- 底部汇总 -->
<div class="summary" id="summary">
  <div class="summary-stat pass"><span class="num" id="passCount">0</span><span class="label">通过</span></div>
  <div class="summary-stat fail"><span class="num" id="failCount">0</span><span class="label">失败</span></div>
  <div class="summary-bar">
    <div class="pass-seg" id="passSeg" style="width:0"></div>
    <div class="fail-seg" id="failSeg" style="width:0"></div>
  </div>
  <div class="summary-stat"><span class="num" id="totalCount">0</span><span class="label">总数</span></div>
  <button class="btn btn-ghost" id="btnRunAll">运行全部 A 组</button>
  <button class="btn btn-ghost" id="btnCopyFailures">复制失败报告</button>
  <button class="btn btn-ghost" id="btnClear">清空</button>
</div>

<script type="module">
  import { LumiBrowserApiClient } from './src/browser-client.js';
  import { TestRunner } from './src/runner.js';
  import { computeDeviceProof, computePairingProof, genNonce } from './src/crypto.js';

  // ===== 状态 =====
  const state = {
    config: null,
    client: null,
    runner: null,
    results: {}, // id -> result
    selectedId: null,
    running: false,
  };

  // ===== DOM 引用 =====
  const $ = (id) => document.getElementById(id);
  const configPanel = $('configPanel');
  const main = $('main');
  const casesApp = $('casesApp');
  const casesDevice = $('casesDevice');
  const casesScenario = $('casesScenario');
  const summary = $('summary');

  // ===== 配置读写 =====
  function readConfig() {
    return {
      baseUrl: $('cfg-baseUrl').value.trim(),
      account: $('cfg-account').value.trim(),
      password: $('cfg-password').value,
      deviceSn: $('cfg-deviceSn').value.trim(),
      deviceSecretB64url: $('cfg-deviceSecret').value.trim(),
      childProfileId: $('cfg-childProfileId').value.trim(),
      productId: $('cfg-productId').value.trim() || 'k1',
      credentialVersion: parseInt($('cfg-credentialVersion').value) || 1,
      capabilityDigest: $('cfg-capabilityDigest').value.trim() || null,
    };
  }

  // 用户/设备分组独立存储 key
  const STORAGE_KEYS = {
    common: 'lumi-test-common',
    user: 'lumi-test-user',
    device: 'lumi-test-device',
  };

  function saveGroupToStorage(group, cfg) {
    try {
      if (group === 'common') {
        localStorage.setItem(STORAGE_KEYS.common, JSON.stringify({ baseUrl: cfg.baseUrl }));
      } else if (group === 'user') {
        localStorage.setItem(STORAGE_KEYS.user, JSON.stringify({
          account: cfg.account, password: cfg.password, childProfileId: cfg.childProfileId,
        }));
      } else if (group === 'device') {
        localStorage.setItem(STORAGE_KEYS.device, JSON.stringify({
          deviceSn: cfg.deviceSn, deviceSecretB64url: cfg.deviceSecretB64url,
          productId: cfg.productId, credentialVersion: cfg.credentialVersion,
        }));
      }
    } catch {}
  }

  function saveConfigToStorage(cfg) {
    saveGroupToStorage('common', cfg);
    saveGroupToStorage('user', cfg);
    saveGroupToStorage('device', cfg);
  }

  function loadConfigFromStorage() {
    try {
      const common = JSON.parse(localStorage.getItem(STORAGE_KEYS.common) || '{}');
      const user = JSON.parse(localStorage.getItem(STORAGE_KEYS.user) || '{}');
      const device = JSON.parse(localStorage.getItem(STORAGE_KEYS.device) || '{}');
      $('cfg-baseUrl').value = common.baseUrl || '';
      $('cfg-account').value = user.account || '';
      $('cfg-password').value = user.password || '';
      $('cfg-childProfileId').value = user.childProfileId || '';
      $('cfg-deviceSn').value = device.deviceSn || '';
      $('cfg-deviceSecret').value = device.deviceSecretB64url || '';
      $('cfg-productId').value = device.productId || 'k1';
      $('cfg-credentialVersion').value = device.credentialVersion || 1;
      $('cfg-capabilityDigest').value = device.capabilityDigest || '';
    } catch {}
  }

  // ===== 校验配置（分组校验） =====
  function validateCommon(cfg) {
    if (!cfg.baseUrl) return { ok: false, error: '缺少: API Base URL' };
    return { ok: true };
  }
  function validateUser(cfg) {
    const missing = [];
    if (!cfg.account) missing.push('账号');
    if (!cfg.password) missing.push('密码');
    if (!cfg.childProfileId) missing.push('child_profile_id');
    if (missing.length) return { ok: false, error: `用户信息缺少: ${missing.join(', ')}` };
    return { ok: true };
  }
  function validateDevice(cfg) {
    const missing = [];
    if (!cfg.deviceSn) missing.push('设备 SN');
    if (!cfg.deviceSecretB64url) missing.push('device_secret');
    if (missing.length) return { ok: false, error: `设备信息缺少: ${missing.join(', ')}` };
    if (cfg.deviceSecretB64url.length !== 43) {
      return { ok: false, error: 'device_secret 应为 43 字符 base64url' };
    }
    return { ok: true };
  }
  function validateConfig(cfg) {
    const vc = validateCommon(cfg); if (!vc.ok) return vc;
    const vu = validateUser(cfg); if (!vu.ok) return vu;
    const vd = validateDevice(cfg); if (!vd.ok) return vd;
    return { ok: true };
  }

  // ===== 保存全部（不强制校验，直接持久化每组已填字段） =====
  $('btnSave').addEventListener('click', () => {
    const cfg = readConfig();
    state.config = cfg;
    saveConfigToStorage(cfg);
    toast('全部配置已保存');
  });

  // ===== 分组保存（只校验该组） =====
  document.querySelectorAll('[data-action="save-group"]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const g = btn.dataset.group;
      const cfg = readConfig();
      let v;
      if (g === 'common') v = validateCommon(cfg);
      else if (g === 'user') v = validateUser(cfg);
      else if (g === 'device') v = validateDevice(cfg);
      else v = { ok: true };
      if (!v.ok) { toast(v.error, 'error'); return; }
      saveGroupToStorage(g, cfg);
      const label = g === 'common' ? 'API 连接' : (g === 'user' ? '用户信息' : '设备信息');
      toast(`${label}已保存`);
    });
  });

  // ===== 连接（校验 + 持久化 + 创建 client/runner） =====
  $('btnConnect').addEventListener('click', () => {
    const cfg = readConfig();
    const v = validateConfig(cfg);
    if (!v.ok) { toast(v.error, 'error'); return; }
    state.config = cfg;
    state.client = new LumiBrowserApiClient({ baseUrl: cfg.baseUrl });
    state.runner = new TestRunner({
      client: state.client,
      config: cfg,
      crypto: { computeDeviceProof, computePairingProof, genNonce },
    });
    saveConfigToStorage(cfg);
    configPanel.classList.add('hidden');
    $('connStatus').innerHTML = `<strong>状态</strong> <span style="color: var(--accent)">已连接</span>`;
    toast('已连接，可以开始测试');
    renderCases();
  });

  $('btnToggleConfig').addEventListener('click', () => {
    configPanel.classList.toggle('hidden');
    main.classList.toggle('config-open');
  });

  // ===== 复制完整请求调试信息（事件委托） =====
  // 用 Map 存储调试数据，避免 HTML 转义问题
  const debugStore = new Map();
  window.__debugStore = debugStore;

  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-debug-id], [data-debug-batch]');
    if (!btn) return;
    // 兼容两种属性：data-debug-id（详情面板）和 data-debug-batch（批量面板）
    const id = btn.dataset.debugId || btn.dataset.debugBatch;
    const data = debugStore.get(id);
    if (!data) {
      toast('调试数据已失效，请重新运行用例', 'error');
      return;
    }
    const text = JSON.stringify(data, null, 2);
    const fallbackCopy = () => {
      // clipboard API 不可用时的兜底（如非 HTTPS、旧浏览器）
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch { return false; }
    };
    const flashSuccess = () => {
      const orig = btn.textContent;
      btn.textContent = '已复制';
      btn.style.background = 'var(--accent)';
      btn.style.color = '#0a0e14';
      setTimeout(() => {
        btn.textContent = orig;
        btn.style.background = '';
        btn.style.color = '';
      }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(flashSuccess).catch(() => {
        if (fallbackCopy()) flashSuccess();
        else toast('复制失败，请手动选择', 'error');
      });
    } else {
      if (fallbackCopy()) flashSuccess();
      else toast('复制失败，请手动选择', 'error');
    }
  });

  // ===== 渲染用例列表 =====
  function renderCases() {
    if (!state.runner) {
      casesApp.innerHTML = '<div class="detail-empty"><div class="icon">⚙</div><div>请先填写配置并连接</div></div>';
      casesDevice.innerHTML = '<div class="detail-empty"><div class="icon">⚙</div><div>请先填写配置并连接</div></div>';
      casesScenario.innerHTML = '<div class="detail-empty"><div class="icon">⚙</div><div>请先填写配置并连接</div></div>';
      return;
    }
    const all = state.runner.listCases();
    // P 组通过 side 字段自动归类（P1.side=device, P2.side=app），无需额外 push 避免重复
    const appCases = all.filter((c) => (c.side === 'app' || c.side === 'both') && c.group !== 'S');
    const deviceCases = all.filter((c) => (c.side === 'device' || c.side === 'both') && c.group !== 'S');
    const scenarioCases = all.filter((c) => c.group === 'S');
    // 排序：按 id 字母序
    appCases.sort((a, b) => a.id.localeCompare(b.id));
    deviceCases.sort((a, b) => a.id.localeCompare(b.id));

    casesApp.innerHTML = renderCaseList(appCases);
    casesDevice.innerHTML = renderCaseList(deviceCases);
    casesScenario.innerHTML = renderCaseList(scenarioCases);
    // 同时渲染 P 组场景到场景标签页
    const pInScenario = all.filter((c) => c.group === 'P');
    if (pInScenario.length) {
      casesScenario.innerHTML += '<div class="group-divider">P 组 · 配对二维码</div>' + renderCaseList(pInScenario);
    }
    // 在场景列表顶部插入序列图
    const seqEl = document.createElement('div');
    seqEl.className = 'scenario-sequence';
    seqEl.innerHTML = renderScenarioSequences();
    casesScenario.insertBefore(seqEl, casesScenario.firstChild);

    document.querySelectorAll('.case-row').forEach((row) => {
      row.addEventListener('click', () => selectCase(row.dataset.id));
    });
  }

  function renderCaseList(cases) {
    let html = '';
    let lastGroup = null;
    const groupLabels = {
      A: 'A 组 · 可用性',
      B: 'B 组 · 健壮性',
      S: 'S 组 · 端到端场景',
      P: 'P 组 · 配对二维码',
    };
    for (const c of cases) {
      if (c.group !== lastGroup) {
        html += `<div class="group-divider">${groupLabels[c.group] || c.group + ' 组'}</div>`;
        lastGroup = c.group;
      }
      const result = state.results[c.id];
      const cls = result ? (result.passed ? 'passed' : 'failed') : 'pending';
      const statusIcon = result
        ? (result.passed ? '✓' : '✗')
        : (state.running && state.selectedId === c.id ? '◐' : '·');
      const statusCls = result ? (result.passed ? 'passed' : 'failed') : (state.running && state.selectedId === c.id ? 'running' : 'pending');
      const sideTag = c.side === 'both' ? '<span style="color: var(--both-side); font-size:9px; margin-left:6px;">⇄</span>' : '';
      html += `
        <div class="case-row ${cls}" data-id="${c.id}">
          <div class="case-id">${c.id}</div>
          <div class="case-name">
            ${c.name}${sideTag}
            <span class="case-desc">${c.desc}</span>
          </div>
          <div class="case-status ${statusCls}">${statusIcon}</div>
        </div>
      `;
    }
    return html;
  }

  // ===== 场景序列图（UML 风格） =====
  function renderScenarioSequences() {
    // S1: UML 序列图，两条泳道（APP / Device），时间从上到下
    const s1Steps = [
      { n: 1, label: '用户登录', from: 'app', to: 'api', api: 'POST /v1/user-sessions' },
      { n: 2, label: '设备认证', from: 'device', to: 'api', api: 'POST /v1/device-sessions' },
      { n: 3, label: 'Bootstrap', from: 'device', to: 'api', api: 'GET /v1/device-bootstrap' },
      { n: 4, label: '获取 Pairing Nonce', from: 'device', to: 'api', api: 'GET /v1/device-pairing-challenges' },
      { n: 5, label: '计算 Pairing Proof', from: 'device', to: 'local', api: 'HMAC-SHA256 (本地)' },
      { n: 6, label: '绑定设备', from: 'app', to: 'api', api: 'POST /v1/device-bindings' },
      { n: 7, label: '查询绑定', from: 'app', to: 'api', api: 'GET /v1/device-bindings/current' },
      { n: 8, label: '解绑设备', from: 'app', to: 'api', api: 'DELETE /v1/device-bindings/current' },
      { n: 9, label: '验证解绑 (404)', from: 'app', to: 'api', api: 'GET /v1/device-bindings/current' },
      { n: 10, label: '刷新 Token', from: 'app', to: 'api', api: 'POST /v1/user-sessions:refresh' },
      { n: 11, label: '用户登出', from: 'app', to: 'api', api: 'DELETE /v1/user-sessions/current' },
    ];

    const s1Svg = renderUmlSequence('S1', '完整生命周期', s1Steps);

    // P1→P2: 配对二维码流程
    const p1Steps = [
      { n: 1, label: '设备认证', from: 'device', to: 'api', api: 'POST /v1/device-sessions' },
      { n: 2, label: 'Bootstrap', from: 'device', to: 'api', api: 'GET /v1/device-bootstrap' },
      { n: 3, label: '获取 Pairing Nonce', from: 'device', to: 'api', api: 'GET /v1/device-pairing-challenges' },
      { n: 4, label: '计算 Pairing Proof', from: 'device', to: 'local', api: 'HMAC-SHA256 (本地)' },
      { n: 5, label: '生成配对 JSON', from: 'device', to: 'local', api: '组装 {sn,proof,nonce,ts,pid,cv}' },
    ];
    const p2Steps = [
      { n: 1, label: '用户登录', from: 'app', to: 'api', api: 'POST /v1/user-sessions' },
      { n: 2, label: '解析配对 JSON', from: 'app', to: 'local', api: 'JSON.parse (模拟扫码)' },
      { n: 3, label: '绑定设备', from: 'app', to: 'api', api: 'POST /v1/device-bindings' },
    ];

    const p1Svg = renderUmlSequence('P1', '设备配对二维码生成', p1Steps);
    const p2Svg = renderUmlSequence('P2', '用户扫码绑定', p2Steps);

    return s1Svg + `
      <div class="seq-card seq-bridge-card">
        <div class="seq-card-title"><span class="tag">P1→P2</span>配对二维码绑定流程</div>
        <div class="seq-bridge-flow">
          <div class="seq-bridge-side">${p1Svg}</div>
          <div class="seq-bridge-mid">
            <div class="seq-bridge-arrow">复制 JSON</div>
            <div class="seq-bridge-arrow">↓</div>
            <div class="seq-bridge-arrow">粘贴 JSON</div>
          </div>
          <div class="seq-bridge-side">${p2Svg}</div>
        </div>
      </div>
    `;

  /**
   * 渲染 UML 风格序列图
   * @param {string} id 场景 ID
   * @param {string} title 场景标题
   * @param {Array} steps 步骤数组 {n, label, from, to, api}
   * from/to: 'app' | 'device' | 'local' | 'api'
   */
  function renderUmlSequence(id, title, steps) {
    // 三条泳道：APP / API / Device
    const lanes = ['app', 'api', 'device'];
    const laneLabels = { app: 'APP · USER', api: 'API 服务器', device: 'DEVICE' };
    // 用具体颜色值（SVG marker fill 对 CSS 变量支持不一致）
    const laneColors = { app: '#56b6e6', api: '#6b7480', device: '#c792ea' };
    const laneIdx = { app: 0, api: 1, device: 2, local: 1 }; // local 归到中间

    const stepHeight = 38;
    const headerHeight = 32;
    const totalHeight = headerHeight + steps.length * stepHeight + 10;
    const laneWidth = 110;
    const totalWidth = laneWidth * 3;

    // 生成泳道头部
    const laneHeaders = lanes.map((lane, i) => {
      const x = i * laneWidth + laneWidth / 2;
      return `
        <rect x="${i * laneWidth + 4}" y="4" width="${laneWidth - 8}" height="${headerHeight - 8}" rx="3" fill="#1d2530" stroke="${laneColors[lane]}" stroke-width="1" opacity="0.95"/>
        <text x="${x}" y="${headerHeight / 2 + 3}" text-anchor="middle" fill="${laneColors[lane]}" font-size="10" font-weight="700" font-family="Space Grotesk, sans-serif">${laneLabels[lane]}</text>
      `;
    }).join('');

    // 生成泳道生命线
    const lifelines = lanes.map((lane, i) => {
      const x = i * laneWidth + laneWidth / 2;
      return `<line x1="${x}" y1="${headerHeight}" x2="${x}" y2="${totalHeight}" stroke="#2a3340" stroke-width="1" stroke-dasharray="2,3"/>`;
    }).join('');

    // 生成步骤箭头
    const stepEls = steps.map((step, i) => {
      const y = headerHeight + 10 + i * stepHeight;
      const fromI = laneIdx[step.from];
      const toI = laneIdx[step.to];
      const fromX = fromI * laneWidth + laneWidth / 2;
      const toX = toI * laneWidth + laneWidth / 2;
      const isLocal = step.to === 'local';
      const arrowColor = isLocal ? '#c792ea' : (step.from === 'app' ? laneColors.app : laneColors.device);
      const midX = (fromX + toX) / 2;
      const markerId = 'arrow-' + arrowColor.replace('#', '');

      // 本地调用画成自循环
      let arrowPath;
      if (isLocal) {
        const loopX = fromX + 30;
        arrowPath = `
          <path d="M ${fromX} ${y} L ${loopX} ${y} L ${loopX} ${y + 14} L ${fromX + 4} ${y + 14}" fill="none" stroke="${arrowColor}" stroke-width="1.5" marker-end="url(#${markerId})"/>
        `;
      } else {
        arrowPath = `
          <line x1="${fromX}" y1="${y}" x2="${toX}" y2="${y}" stroke="${arrowColor}" stroke-width="1.5" marker-end="url(#${markerId})"/>
        `;
      }

      // 激活条（发起方）
      const activateFrom = `<rect x="${fromX - 4}" y="${y - 4}" width="8" height="${stepHeight - 6}" fill="${arrowColor}" opacity="0.15"/>`;
      // 激活条（接收方）
      const activateTo = isLocal ? '' : `<rect x="${toX - 4}" y="${y - 2}" width="8" height="${stepHeight - 10}" fill="${arrowColor}" opacity="0.25"/>`;

      return `
        ${activateFrom}
        ${activateTo}
        ${arrowPath}
        <text x="${midX}" y="${y - 4}" text-anchor="middle" fill="#e6edf3" font-size="9" font-weight="600">${step.n}. ${step.label}</text>
        <text x="${midX}" y="${y + 9}" text-anchor="middle" fill="#6b7480" font-size="8" font-family="JetBrains Mono, monospace">${step.api}</text>
      `;
    }).join('');

    // 箭头标记定义（每个用到的颜色一个 marker）
    const usedColors = new Set();
    steps.forEach((s) => {
      const c = s.to === 'local' ? '#c792ea' : (s.from === 'app' ? '#56b6e6' : '#c792ea');
      usedColors.add(c);
    });
    const arrowDefs = `
      <defs>
        ${[...usedColors].map((color) => {
          const mid = 'arrow-' + color.replace('#', '');
          return `<marker id="${mid}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="${color}"/></marker>`;
        }).join('')}
      </defs>
    `;

    return `
      <div class="seq-card">
        <div class="seq-card-title"><span class="tag">${id}</span>${title}</div>
        <div class="uml-seq-container">
          <svg viewBox="0 0 ${totalWidth} ${totalHeight}" xmlns="http://www.w3.org/2000/svg" style="width: 100%; max-width: ${totalWidth}px; font-family: inherit;">
            ${arrowDefs}
            ${laneHeaders}
            ${lifelines}
            ${stepEls}
          </svg>
        </div>
      </div>
    `;
  }

  // ===== 选中用例 → 显示详情 =====
  function selectCase(id) {
    state.selectedId = id;
    document.querySelectorAll('.case-row').forEach((r) => {
      r.classList.toggle('selected', r.dataset.id === id);
    });
    renderDetail(id);
  }

  function renderDetail(id) {
    const result = state.results[id];
    const caseDef = state.runner?.listCases().find((c) => c.id === id);
    if (!caseDef) return;
    // 清空调试数据缓存，避免内存累积（renderStep 会重新注册）
    debugStore.clear();
    const overlay = $('detailOverlay');
    overlay.style.display = 'block';
    setTimeout(() => { overlay.style.transform = 'translateX(0)'; }, 10);

    const statusCls = result ? (result.passed ? 'pass' : 'fail') : 'pending';
    const statusText = result ? (result.passed ? 'PASS' : 'FAIL') : 'PENDING';

    let html = `
      <div style="padding: 16px 20px;">
        <div class="detail-header">
          <div class="detail-id ${statusCls.toLowerCase()}">${id}</div>
          <div class="detail-title">
            <h2>${caseDef.name}</h2>
            <div class="desc">${caseDef.desc}</div>
          </div>
          <span class="status-badge ${statusCls}">${statusText}</span>
          <button class="btn btn-toggle ${result ? '' : 'disabled'}" onclick="runSingle('${id}')" ${result && !state.running ? '' : 'disabled'}>重跑</button>
          <button class="btn btn-ghost btn-toggle" onclick="closeDetail()">关闭</button>
        </div>
    `;

    if (!result) {
      html += `
        <div class="detail-empty">
          <div class="icon">○</div>
          <div>用例尚未执行</div>
          <button class="btn btn-primary" onclick="runSingle('${id}')">立即运行</button>
        </div>
      `;
    } else {
      // 参数编辑表单（单 API 用例 A 组）
      const paramSchema = state.runner.getParamSchema ? state.runner.getParamSchema(id) : [];
      if (paramSchema.length > 0) {
        const currentOverrides = state.runner.getParamOverrides(id);
        html += `
          <div class="section" style="background: rgba(124, 246, 166, 0.04); border: 1px solid rgba(124, 246, 166, 0.2); border-radius: 6px; padding: 12px;">
            <div class="section-title" style="color: var(--accent); display: flex; align-items: center; justify-content: space-between;">
              <span>请求参数</span>
              <span style="font-size: 10px; color: var(--fg-3); font-weight: 400;">可修改后重跑</span>
            </div>
            <div class="param-form" id="paramForm-${id}">
              ${paramSchema.map(f => {
                const isAuto = f.auto;
                const currentVal = currentOverrides[f.key] ?? (isAuto ? '' : (f.default ?? ''));
                const inputVal = typeof currentVal === 'string' ? escapeHtml(currentVal) : String(currentVal ?? '');
                return `
                  <div class="param-field" style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
                    <label style="width: 140px; font-size: 11px; color: var(--fg-2); flex-shrink: 0;">${escapeHtml(f.label)}${f.required ? '<span style="color: var(--error);">*</span>' : ''}</label>
                    <input type="${f.type === 'password' ? 'password' : 'text'}"
                      data-param-key="${f.key}"
                      data-param-type="${f.type}"
                      value="${inputVal}"
                      placeholder="${isAuto ? escapeHtml(f.default) : ''}"
                      ${isAuto ? 'data-auto="1"' : ''}
                      style="flex: 1; background: var(--bg-3); border: 1px solid var(--border); border-radius: 3px; padding: 5px 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--fg); ${isAuto ? 'opacity: 0.6;' : ''}"
                    />
                  </div>
                `;
              }).join('')}
              <div style="margin-top: 8px; display: flex; gap: 8px;">
                <button class="btn btn-primary btn-mini" id="applyParamsBtn-${id}">应用参数并运行</button>
                <button class="btn btn-ghost btn-mini" id="resetParamsBtn-${id}">重置默认</button>
              </div>
            </div>
          </div>
        `;
      }
      // P1: 展示生成的配对 JSON（可复制）
      if (id === 'P1' && result.pairingJson) {
        const pjsonId = `pjson-${Date.now()}`;
        debugStore.set(pjsonId, result.pairingJson);
        html += `
          <div class="section" style="background: rgba(255, 180, 84, 0.06); border: 1px solid rgba(255, 180, 84, 0.3); border-radius: 6px; padding: 12px;">
            <div class="section-title" style="color: var(--warn);">配对二维码内容 (JSON)</div>
            <pre style="background: var(--bg-3); padding: 10px; border-radius: 4px; font-size: 11px; word-break: break-all; white-space: pre-wrap;">${escapeHtml(result.pairingJson)}</pre>
            <div style="margin-top: 8px; display: flex; gap: 8px;">
              <button class="btn btn-primary btn-mini" data-copy-pjson="${pjsonId}">复制 JSON</button>
              <span style="font-size: 11px; color: var(--fg-3); align-self: center;">复制后粘贴到 P2 输入框模拟扫码</span>
            </div>
          </div>
        `;
      }
      // P2: 粘贴配对 JSON 输入框
      if (id === 'P2') {
        const currentInput = state.runner.state.pairingJsonInput || state.runner.state.pairingJson || '';
        html += `
          <div class="section" style="background: rgba(86, 182, 230, 0.06); border: 1px solid rgba(86, 182, 230, 0.3); border-radius: 6px; padding: 12px;">
            <div class="section-title" style="color: var(--app-side);">配对二维码内容 (粘贴 JSON 模拟扫码)</div>
            <textarea id="p2PairingInput" style="width: 100%; min-height: 80px; background: var(--bg-3); border: 1px solid var(--border); border-radius: 4px; padding: 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--fg); resize: vertical;" placeholder='粘贴 P1 生成的 JSON，如 {"sn":"...","proof":"...","nonce":"...","ts":...,"pid":"...","cv":...}'>${escapeHtml(currentInput)}</textarea>
            <div style="margin-top: 8px; display: flex; gap: 8px; align-items: center;">
              <button class="btn btn-primary btn-mini" id="p2UseInputBtn">使用此 JSON 运行</button>
              <span style="font-size: 11px; color: var(--fg-3);">留空则自动使用 P1 生成的 JSON</span>
            </div>
          </div>
        `;
      }
      if (result.error) {
        html += `<div class="section"><div class="section-title">错误</div><pre style="color: var(--error);">${escapeHtml(result.error)}</pre></div>`;
      }
      if (result.expectedStatus) {
        html += `<div class="section">
          <div class="section-title">HTTP 状态</div>
          <div style="display:flex; gap:12px; font-size:12px;">
            <span>预期: <strong style="color: var(--info);">${Array.isArray(result.expectedStatus) ? result.expectedStatus.join(' / ') : result.expectedStatus}</strong></span>
            <span>实际: <strong style="color: ${result.passed ? 'var(--accent)' : 'var(--error)'}">${result.actualStatus ?? '—'}</strong></span>
          </div>
        </div>`;
      }
      if (result.steps && result.steps.length) {
        html += `<div class="section"><div class="section-title">请求步骤 (${result.steps.length})</div>`;
        for (const step of result.steps) {
          html += renderStep(step);
        }
        html += `</div>`;
      }
      if (result.assertions && result.assertions.length) {
        html += `<div class="section"><div class="section-title">断言 (${result.assertions.length})</div><div class="assertions">`;
        for (const a of result.assertions) {
          html += `<div class="assertion ${a.passed ? 'pass' : 'fail'}">
            <div class="icon">${a.passed ? '✓' : '✗'}</div>
            <div class="name">${escapeHtml(a.name)}</div>
          </div>`;
        }
        html += `</div></div>`;
      }
    }

    html += `</div>`;
    overlay.innerHTML = html;

    // P1: 复制配对 JSON 按钮
    const copyBtn = overlay.querySelector('[data-copy-pjson]');
    if (copyBtn) {
      copyBtn.addEventListener('click', () => {
        const data = debugStore.get(copyBtn.dataset.copyPjson);
        if (!data) return;
        const flashSuccess = () => {
          const orig = copyBtn.textContent;
          copyBtn.textContent = '已复制';
          copyBtn.style.background = 'var(--accent)';
          copyBtn.style.color = '#0a0e14';
          setTimeout(() => {
            copyBtn.textContent = orig;
            copyBtn.style.background = '';
            copyBtn.style.color = '';
          }, 1200);
        };
        const fallbackCopy = () => {
          try {
            const ta = document.createElement('textarea');
            ta.value = data;
            ta.style.position = 'fixed'; ta.style.left = '-9999px';
            document.body.appendChild(ta); ta.select();
            const ok = document.execCommand('copy');
            document.body.removeChild(ta);
            return ok;
          } catch { return false; }
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(data).then(flashSuccess).catch(() => {
            if (fallbackCopy()) flashSuccess();
            else toast('复制失败', 'error');
          });
        } else {
          if (fallbackCopy()) flashSuccess();
          else toast('复制失败', 'error');
        }
      });
    }

    // P2: 使用输入框 JSON 运行
    const p2Btn = overlay.querySelector('#p2UseInputBtn');
    if (p2Btn) {
      p2Btn.addEventListener('click', () => {
        const ta = overlay.querySelector('#p2PairingInput');
        const val = ta?.value?.trim() || '';
        // 写入 runner.state，P2 会优先读取 pairingJsonInput
        state.runner.state.pairingJsonInput = val || null;
        runSingle('P2');
      });
    }

    // 参数表单：应用参数并运行
    const applyBtn = overlay.querySelector(`#applyParamsBtn-${id}`);
    if (applyBtn) {
      applyBtn.addEventListener('click', () => {
        const form = overlay.querySelector(`#paramForm-${id}`);
        const inputs = form.querySelectorAll('input[data-param-key]');
        const overrides = {};
        inputs.forEach((inp) => {
          const key = inp.dataset.paramKey;
          const type = inp.dataset.paramType;
          const isAuto = inp.dataset.auto === '1';
          const val = inp.value.trim();
          // auto 字段空值不覆盖（用运行时自动值）
          if (isAuto && !val) return;
          if (!val) return; // 空值不覆盖
          if (type === 'number') overrides[key] = Number(val);
          else overrides[key] = val;
        });
        state.runner.setParamOverrides(id, overrides);
        runSingle(id);
      });
    }
    // 参数表单：重置默认
    const resetBtn = overlay.querySelector(`#resetParamsBtn-${id}`);
    if (resetBtn) {
      resetBtn.addEventListener('click', () => {
        state.runner.setParamOverrides(id, {});
        renderDetail(id); // 重新渲染
      });
    }
  }

  function renderStep(step) {
    const status = step.response?.status;
    const hasError = !!step.error;
    // 错误步骤但 status 缺失（如异常抛出）→ s5xx（红），否则按 status 分级
    let statusCls = hasError && (status === undefined || status === null) ? 's5xx' : 's2xx';
    if (typeof status === 'number') {
      if (status === 0) statusCls = 's5xx';
      else if (status >= 500) statusCls = 's5xx';
      else if (status >= 400) statusCls = 's4xx';
      else statusCls = 's2xx';
    } else if (status === 'ok') {
      statusCls = 'sok';
    }
    const method = step.method || 'GET';
    const methodCls = ['GET','POST','DELETE','PUT','PATCH'].includes(method) ? method : (method === 'LOCAL' ? 'LOCAL' : 'B');
    const debugData = step.error?.debug || null;
    const debugId = debugData ? `dbg-${Math.random().toString(36).slice(2, 9)}` : null;
    // 注册到 debugStore，避免 HTML 转义导致 JSON 解析失败
    if (debugData && debugId) {
      debugStore.set(debugId, debugData);
    }

    let html = `
      <div class="step${hasError ? ' step-error' : ''}">
        <div class="step-header">
          <span class="step-method ${methodCls}">${method}</span>
          <span class="step-path">${escapeHtml(step.path)}</span>
          ${step.request?.url ? `<span class="step-url" title="${escapeHtml(step.request.url)}">${escapeHtml(step.request.url)}</span>` : ''}
          <span class="step-status ${statusCls}">${status ?? '—'}</span>
          ${debugData ? `<button class="btn btn-mini step-copy-btn" data-debug-id="${debugId}">复制完整请求</button>` : ''}
        </div>
        <div class="step-body">
    `;

    // 请求行 + URL + query
    if (step.request?.url) {
      const u = new URL(step.request.url);
      let reqLine = `${step.request.method || method} ${u.pathname}`;
      if (u.search) reqLine += `?${u.search.slice(1)}`;
      html += `<div class="step-body-label">请求</div><pre>${escapeHtml(reqLine)}</pre>`;
      // 展示实际请求路径（浏览器代理版）
      if (step.request.actualUrl || step.request.targetUrl) {
        const lines = [];
        if (step.request.actualUrl) lines.push(`代理: ${step.request.actualUrl}`);
        if (step.request.targetUrl) lines.push(`目标: ${step.request.targetUrl}`);
        html += `<pre class="step-sub" style="color: var(--fg-3);">${escapeHtml(lines.join('\n'))}</pre>`;
      }
      if (step.request.headers) {
        const safeH = { ...step.request.headers };
        if (safeH.authorization) {
          const v = String(safeH.authorization);
          safeH.authorization = v.length > 12 ? v.slice(0, 12) + '***' : '***';
        }
        html += `<pre class="step-sub">${escapeHtml(JSON.stringify(safeH, null, 2))}</pre>`;
      }
    }

    // 请求体
    if (step.request?.body !== undefined && step.request?.body !== null) {
      html += `<div class="step-body-label">请求体</div><pre>${escapeHtml(JSON.stringify(step.request.body, null, 2))}</pre>`;
    }

    // 错误（简要）
    if (step.error) {
      const errBrief = {
        message: step.error.message,
        status: step.error.status,
        code: step.error.code,
      };
      html += `<div class="step-body-label" style="color: var(--error);">错误</div><pre style="color: var(--error);">${escapeHtml(JSON.stringify(errBrief, null, 2))}</pre>`;
    }

    // 响应体
    if (step.response?.body !== undefined && step.response?.body !== null) {
      html += `<div class="step-body-label">响应体</div><pre>${escapeHtml(typeof step.response.body === 'string' ? step.response.body : JSON.stringify(step.response.body, null, 2))}</pre>`;
    }

    html += `</div></div>`;
    return html;
  }

  window.closeDetail = function() {
    const overlay = $('detailOverlay');
    overlay.style.transform = 'translateX(100%)';
    setTimeout(() => { overlay.style.display = 'none'; }, 300);
  };

  // ===== 运行 =====
  window.runSingle = async function(id) {
    if (!state.runner) { toast('请先连接', 'error'); return; }
    if (state.running) { toast('正在运行中', 'warn'); return; }
    state.running = true;
    state.selectedId = id;
    renderCases();
    try {
      const r = await state.runner.run(id);
      state.results[id] = r;
      renderCases();
      renderDetail(id);
      updateSummary();
      toast(`${id} ${r.passed ? '通过' : '失败'}`, r.passed ? 'success' : 'error');
    } catch (e) {
      toast(`${id} 异常: ${e.message}`, 'error');
    } finally {
      state.running = false;
      renderCases();
    }
  };

  async function runGroup(groupFilter) {
    if (!state.runner) { toast('请先连接', 'error'); return; }
    if (state.running) { toast('正在运行中', 'warn'); return; }
    state.running = true;
    const all = state.runner.listCases();
    const ids = all.filter((c) => groupFilter(c)).map((c) => c.id);
    state._lastBatchIds = ids; // 记录本次批量运行的用例，供结果面板使用
    try {
      for (const id of ids) {
        state.selectedId = id;
        renderCases();
        const r = await state.runner.run(id);
        state.results[id] = r;
        renderCases();
        renderDetail(id);
        updateSummary();
        await new Promise((res) => setTimeout(res, 50));
      }
      const passed = ids.filter((id) => state.results[id]?.passed).length;
      const failed = ids.length - passed;
      toast(`${ids.length} 个用例完成: ${passed} 通过, ${failed} 失败`, passed === ids.length ? 'success' : 'warn');
      // 批量运行结束后弹出结果面板
      if (ids.length > 1 && failed > 0) {
        showBatchResult(ids, 'failed');
      }
    } finally {
      state.running = false;
      renderCases();
    }
  }

  // ===== 批量结果面板 =====
  let batchFilterMode = 'failed';
  let batchStore = new Map(); // 存储批量运行结果，供复制使用

  function showBatchResult(ids, filter = 'failed') {
    batchFilterMode = filter;
    batchStore.clear();
    const overlay = $('batchOverlay');
    const list = $('batchList');
    const summary = $('batchSummary');

    // 收集结果
    const results = ids.map((id) => {
      const r = state.results[id];
      const caseDef = state.runner?.listCases().find((c) => c.id === id);
      const item = { id, name: caseDef?.name || id, result: r, caseDef };
      batchStore.set(id, item);
      return item;
    });

    const passed = results.filter((x) => x.result?.passed).length;
    const failed = results.length - passed;
    summary.textContent = `${results.length} 个用例 · ${passed} 通过 · ${failed} 失败`;

    // 更新筛选按钮状态
    document.querySelectorAll('.batch-filter-btn').forEach((b) => {
      b.classList.toggle('active', b.dataset.filter === filter);
    });

    renderBatchList(results, filter);
    overlay.classList.add('show');
  }

  function renderBatchList(results, filter) {
    const list = $('batchList');
    let filtered = results;
    if (filter === 'failed') filtered = results.filter((x) => !x.result?.passed);
    else if (filter === 'passed') filtered = results.filter((x) => x.result?.passed);

    if (filtered.length === 0) {
      list.innerHTML = `<div class="detail-empty"><div class="icon">○</div><div>${filter === 'failed' ? '没有失败用例' : filter === 'passed' ? '没有通过用例' : '无结果'}</div></div>`;
      return;
    }

    list.innerHTML = filtered.map((item) => {
      const r = item.result;
      const passed = r?.passed;
      const cls = passed ? 'passed' : 'failed';
      const statusTxt = passed ? 'PASS' : 'FAIL';
      const statusCls = passed ? 'pass' : 'fail';
      const errLine = r?.error ? `<div class="err-msg">${escapeHtml(r.error)}</div>` : '';
      const actualStatus = r?.actualStatus != null ? ` · HTTP ${r.actualStatus}` : '';

      // 步骤简要列表
      const stepsHtml = (r?.steps || []).map((s, i) => {
        const m = s.method || 'GET';
        const st = s.response?.status;
        // 统一颜色：网络错误(0) / 4xx / 5xx → 红；2xx/3xx → 绿；无 status(undefined) → 灰
        const stColor = (typeof st === 'number' && (st === 0 || st >= 400))
          ? 'var(--error)'
          : (typeof st === 'number' && st < 400) ? 'var(--accent)' : 'var(--fg-3)';
        const errFlag = s.error ? ` <span style="color:var(--error)">⚠</span>` : '';
        return `<div class="step-mini">
          <span class="m ${m}">${m}</span>
          <span>${escapeHtml(s.path || '')}</span>
          <span class="s" style="color: ${stColor}">${st ?? '—'}${errFlag}</span>
        </div>`;
      }).join('');

      // 失败断言
      const failedAssertions = (r?.assertions || []).filter(a => !a.passed);
      const assertHtml = failedAssertions.length
        ? `<div style="margin-top:6px; font-size:11px; color: var(--error);">失败断言:</div>
           ${failedAssertions.map(a => `<div style="font-size:11px; color: var(--error); padding-left:8px;">✗ ${escapeHtml(a.name)}</div>`).join('')}`
        : '';

      // 错误步骤的 debug 信息（可单独复制）
      // 使用全量 steps 的下标 i（与 debugStore 注册时的 key 一致），避免索引错位
      const errorSteps = (r?.steps || [])
        .map((s, i) => ({ s, i }))
        .filter(({ s }) => s.error?.debug);
      const debugBtns = errorSteps.length
        ? errorSteps.map(({ s, i }) => `<button class="btn btn-mini step-copy-btn" data-debug-batch="${item.id}-${i}" style="margin-top:4px;">复制步骤 ${i+1} 完整请求</button>`).join('')
        : '';

      return `
        <div class="batch-item ${cls}" data-batch-id="${item.id}">
          <div class="batch-item-header" onclick="this.parentElement.classList.toggle('expanded')">
            <span class="batch-item-id">${item.id}</span>
            <span class="batch-item-name">${escapeHtml(item.name)}${actualStatus}</span>
            <span class="batch-item-status ${statusCls}">${statusTxt}</span>
          </div>
          <div class="batch-item-detail">
            ${errLine}
            ${assertHtml}
            ${stepsHtml ? `<div class="step-list">${stepsHtml}</div>` : ''}
            ${debugBtns}
          </div>
        </div>
      `;
    }).join('');

    // 注册 debug 数据到 debugStore（供复制按钮使用）
    filtered.forEach((item) => {
      const r = item.result;
      if (!r?.steps) return;
      r.steps.forEach((s, i) => {
        if (s.error?.debug) {
          debugStore.set(`${item.id}-${i}`, s.error.debug);
        }
      });
    });
  }

  // 批量结果面板事件
  $('btnBatchClose').addEventListener('click', () => {
    $('batchOverlay').classList.remove('show');
  });

  document.querySelectorAll('.batch-filter-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const f = btn.dataset.filter;
      batchFilterMode = f;
      document.querySelectorAll('.batch-filter-btn').forEach((b) => b.classList.toggle('active', b === btn));
      const results = Array.from(batchStore.values());
      renderBatchList(results, f);
    });
  });

  $('btnBatchCopy').addEventListener('click', () => {
    if (!state.runner) { toast('请先连接', 'error'); return; }
    const report = state.runner.collectFailureReport();
    if (report.failed === 0) {
      toast(report.total === 0 ? '暂无运行结果' : '全部通过，无失败用例');
      return;
    }
    const text = JSON.stringify(report, null, 2);
    const btn = $('btnBatchCopy');
    const flashSuccess = () => {
      const orig = btn.textContent;
      btn.textContent = `已复制 ${report.failed} 个失败`;
      btn.style.background = 'var(--accent)';
      btn.style.color = '#0a0e14';
      setTimeout(() => {
        btn.textContent = orig;
        btn.style.background = '';
        btn.style.color = '';
      }, 1800);
    };
    const fallbackCopy = () => {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch { return false; }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(flashSuccess).catch(() => {
        if (fallbackCopy()) flashSuccess();
        else toast('复制失败，请手动选择', 'error');
      });
    } else {
      if (fallbackCopy()) flashSuccess();
      else toast('复制失败，请手动选择', 'error');
    }
  });

  // 批量面板内单步复制按钮（事件委托，复用已有 data-debug-id 逻辑）
  // 修改原有 document click 委托以兼容 data-debug-batch


  document.querySelectorAll('[data-action="run-group"]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const g = btn.dataset.group;
      if (g === 'A-app') runGroup((c) => c.group === 'A' && (c.side === 'app' || c.side === 'both'));
      else if (g === 'B-app') runGroup((c) => c.group === 'B' && (c.side === 'app' || c.side === 'both'));
      else if (g === 'A-device') runGroup((c) => c.group === 'A' && (c.side === 'device' || c.side === 'both'));
      else if (g === 'B-device') runGroup((c) => c.group === 'B' && (c.side === 'device' || c.side === 'both'));
      else if (g === 'S-all') runGroup((c) => c.group === 'S');
    });
  });

  // ===== Tab 切换 =====
  document.querySelectorAll('.main-tab').forEach((tab) => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.main-tab').forEach((t) => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach((c) => c.classList.remove('active'));
      tab.classList.add('active');
      const target = tab.dataset.tab;
      $('tabUnit').classList.toggle('active', target === 'unit');
      $('tabScenario').classList.toggle('active', target === 'scenario');
    });
  });

  $('btnRunAll').addEventListener('click', () => {
    runGroup((c) => c.group === 'A');
  });

  // ===== 复制失败报告 =====
  $('btnCopyFailures').addEventListener('click', () => {
    if (!state.runner) { toast('请先连接', 'error'); return; }
    const report = state.runner.collectFailureReport();
    if (report.failed === 0) {
      toast(report.total === 0 ? '暂无运行结果' : '全部通过，无失败用例');
      return;
    }
    const text = JSON.stringify(report, null, 2);
    const btn = $('btnCopyFailures');
    const flashSuccess = () => {
      const orig = btn.textContent;
      btn.textContent = `已复制 ${report.failed} 个失败`;
      btn.style.background = 'var(--accent)';
      btn.style.color = '#0a0e14';
      setTimeout(() => {
        btn.textContent = orig;
        btn.style.background = '';
        btn.style.color = '';
      }, 1800);
    };
    const fallbackCopy = () => {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch { return false; }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(flashSuccess).catch(() => {
        if (fallbackCopy()) flashSuccess();
        else toast('复制失败，请手动选择', 'error');
      });
    } else {
      if (fallbackCopy()) flashSuccess();
      else toast('复制失败，请手动选择', 'error');
    }
  });
  $('btnClear').addEventListener('click', () => {
    state.results = {};
    if (state.runner) state.runner.results = {};
    renderCases();
    updateSummary();
    closeDetail();
    toast('已清空');
  });

  // ===== 汇总 =====
  function updateSummary() {
    const all = Object.values(state.results);
    const pass = all.filter((r) => r.passed).length;
    const fail = all.filter((r) => !r.passed).length;
    const total = all.length;
    $('passCount').textContent = pass;
    $('failCount').textContent = fail;
    $('totalCount').textContent = total;
    const pct = total ? 100 / total : 0;
    $('passSeg').style.width = `${pass * pct}%`;
    $('failSeg').style.width = `${fail * pct}%`;
    summary.classList.add('visible');
  }

  // ===== Toast =====
  function toast(msg, type = 'success') {
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => {
      t.style.animation = 'slideIn 0.2s reverse';
      setTimeout(() => t.remove(), 200);
    }, 2500);
  }

  // ===== 工具 =====
  function escapeHtml(s) {
    if (s === null || s === undefined) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ===== 初始化 =====
  loadConfigFromStorage();
  renderCases();
  main.classList.add('config-open');
</script>

</body>
</html>
